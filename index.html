<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenTrack</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <!-- Abre la conexión con Supabase mientras todavía se baja el JS (ahorra el saludo TCP/TLS, ~1 s). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Complemento del truco en public/404.html: si venimos de una
      // redirección por una ruta interna no encontrada en GitHub Pages,
      // restauramos la URL real antes de que React Router monte.
      (function () {
        var params = new URLSearchParams(location.search);
        var ruta = params.get('ruta');
        if (ruta) {
          history.replaceState(null, '', ruta);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
